<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">GrantsCopilot social preview</title>
  <desc id="desc">High contrast GrantsCopilot preview image for social sharing.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#041d38"/>
      <stop offset="56%" stop-color="#071a3a"/>
      <stop offset="100%" stop-color="#0f3f82"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#69a1ff"/>
      <stop offset="100%" stop-color="#35c386"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000000" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#background)"/>
  <circle cx="1010" cy="178" r="220" fill="#2167e8" opacity="0.22"/>
  <circle cx="186" cy="1000" r="260" fill="#35c386" opacity="0.16"/>

