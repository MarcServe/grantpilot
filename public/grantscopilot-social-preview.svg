    <rect x="302" y="226" width="596" height="398" rx="54" fill="#f4f8ff" stroke="#d8e5f8" stroke-width="10"/>
    <path d="M430 328h340M430 424h244M430 520h302" fill="none" stroke="#071a3a" stroke-width="42" stroke-linecap="round"/>
    <circle cx="792" cy="516" r="104" fill="url(#accent)"/>
